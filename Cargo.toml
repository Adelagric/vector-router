[package]
name = "vector-router"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
description = "Trust layer between AI agents and your vector database — Rust gRPC middleware that validates, normalizes and routes embeddings before they corrupt your enterprise memory."
repository = "https://github.com/Adelagric/vector-router"
authors = ["Adel Kaleche <kaleche@gmail.com>"]

[dependencies]
tonic = "=0.14.5"
tonic-prost = "=0.14.5"
prost = "=0.14.3"
tokio = { version = "=1.52.1", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time"] }
thiserror = "=2.0.18"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.140"
figment = { version = "=0.10.19", features = ["toml", "env"] }
arc-swap = "=1.9.1"
bytemuck = "=1.25.0"
crossbeam-queue = "=0.3.12"
qdrant-client = { version = "=1.12.0", default-features = false }
async-trait = "=0.1.89"
tower = { version = "=0.5.3", features = ["limit"] }
axum = "=0.8.9"
metrics = "=0.24.3"
metrics-exporter-prometheus = "=0.18.1"

[build-dependencies]
tonic-prost-build = "=0.14.5"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[dev-dependencies]
criterion = "=0.8.2"
loom = "=0.7.2"
tokio-stream = { version = "=0.1.18", features = ["net"] }

[[bin]]
name = "vector-router"
path = "src/main.rs"

[[bench]]
name = "normalize"
harness = false

[[bench]]
name = "alignment"
harness = false
