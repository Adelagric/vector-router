# Configuration de référence du middleware vector-router.
#
# Chemin par défaut : ./config.toml (overridable via VR_CONFIG_PATH).
# Tous les champs sont surchargeables par variable d'env préfixée `VR_`,
# séparateur `__` pour les sous-champs. Exemple :
#   VR_SERVER__GRPC_BIND="0.0.0.0:50051"
#   VR_ADMIN__BEARER_TOKEN="..."
#   VR_VDB__URL="http://qdrant.prod:6334"

[server]
grpc_bind = "0.0.0.0:50051"
http_bind = "0.0.0.0:9090"
# Requêtes simultanées max (rate limit via ConcurrencyLimitLayer).
max_concurrent_requests = 1024
# Taille max d'un message gRPC entrant, en octets. Rejet avant parsing.
max_decoding_message_size_bytes = 16_777_216

[admin]
# Token bearer pour les endpoints /admin/* (comparaison temps constant).
# En prod, injecter via secret manager — pas en dur dans le TOML committé.
bearer_token = "change-me-in-production"

[vdb]
url = "http://qdrant:6334"
# Optionnel : clé API Qdrant. Laisse vide pour auth désactivée.
# api_key = "your-key"
timeout_ms = 500
max_retries = 3
retry_base_delay_ms = 50

[pool]
# Nombre de buffers par worker tokio (N = buffers_per_worker × nb_workers).
buffers_per_worker = 2
# Nombre de workers tokio. Non défini = détection auto (num cores).
# worker_threads = 8

[telemetry]
log_level = "info"
# Optionnel : endpoint OTLP pour export des traces.
# otlp_endpoint = "http://otel-collector:4317"

# --- Modèles déclarés -------------------------------------------------------
# Chaque modèle produit des vecteurs d'une dimension fixe, avec ou sans
# normalisation, et cible un namespace (collection) Qdrant dédié.
#
# Un modèle non déclaré = requête rejetée avec UnknownModel. Pas de
# découverte automatique.

[models."openai-text-embedding-3-small"]
dim = 1536
normalize = true
vdb_namespace = "prod-openai-small"

[models."cohere-embed-english-v3"]
dim = 1024
normalize = false
vdb_namespace = "prod-cohere-en"
