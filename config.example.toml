# Reference configuration for the vector-router middleware.
#
# Default path: ./config.toml (overridable via VR_CONFIG_PATH).
# Every field can be overridden by an env var prefixed `VR_`,
# separator `__` for sub-fields. Example:
#   VR_SERVER__GRPC_BIND="0.0.0.0:50051"
#   VR_ADMIN__BEARER_TOKEN="..."
#   VR_VDB__URL="http://qdrant.prod:6334"

[server]
grpc_bind = "0.0.0.0:50051"
http_bind = "0.0.0.0:9090"
# Max concurrent requests (rate limit via ConcurrencyLimitLayer).
max_concurrent_requests = 1024
# Max incoming gRPC message size, in bytes. Rejected before parsing.
max_decoding_message_size_bytes = 16_777_216

[admin]
# Bearer token for the /admin/* endpoints (constant-time comparison).
# In prod, inject via a secret manager — not hardcoded in the committed TOML.
bearer_token = "change-me-in-production"

[vdb]
# Backend: "qdrant" (default) or "pgvector". Omit for Qdrant.
backend = "qdrant"
# Qdrant: cluster URL. pgvector: a Postgres connection string, e.g.
#   url = "postgres://user:pass@postgres:5432/vectors"
url = "http://qdrant:6334"
# Optional: Qdrant API key. Leave empty to disable auth. (pgvector carries
# its auth in `url`.)
# api_key = "your-key"
timeout_ms = 500
max_retries = 3
retry_base_delay_ms = 50

# --- pgvector backend (build with `--features pgvector`) --------------------
# To target PostgreSQL + pgvector instead of Qdrant, set:
#   backend = "pgvector"
#   url     = "postgres://user:pass@postgres:5432/vectors"
# Each model's `vdb_namespace` becomes a table (one per model dimension);
# the table and its HNSW index are auto-created on startup. pgvector-only
# knobs, both optional:
#   ef_search       = 80   # HNSW recall/latency per query (SET LOCAL); higher = better recall
#   max_connections = 16   # sqlx connection-pool size

[pool]
# Number of buffers per tokio worker (N = buffers_per_worker × n_workers).
buffers_per_worker = 2
# Number of tokio workers. Unset = auto-detect (num cores).
# worker_threads = 8

[telemetry]
log_level = "info"
# Optional: OTLP endpoint for trace export.
# otlp_endpoint = "http://otel-collector:4317"

# --- Declared models --------------------------------------------------------
# Each model produces vectors of a fixed dimension, with or without
# normalization, and targets a dedicated namespace (a Qdrant collection, or
# a pgvector table).
#
# An undeclared model = request rejected with UnknownModel. No automatic
# discovery.

[models."openai-text-embedding-3-small"]
dim = 1536
normalize = true
vdb_namespace = "prod-openai-small"

[models."cohere-embed-english-v3"]
dim = 1024
normalize = false
vdb_namespace = "prod-cohere-en"
