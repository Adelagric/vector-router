name: Extended

# Slow verifications (miri + loom). Kept separate from the CI workflow so
# pushes and PRs are not blocked while these run. Triggered on:
#   - every push to main
#   - nightly cron at 03:17 UTC

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  miri:
    name: miri (math + pool)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protobuf compiler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - name: Nightly toolchain + miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: miri

      - name: cargo miri setup
        run: cargo miri setup

      - name: cargo miri test --lib math
        run: cargo miri test --lib math

      - name: cargo miri test --lib pool
        run: cargo miri test --lib pool

  loom:
    name: loom (registry concurrency model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protobuf compiler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - name: Toolchain stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: loom

      - name: RUSTFLAGS=--cfg loom cargo test --release --lib registry_loom
        env:
          RUSTFLAGS: "--cfg loom"
        run: cargo test --release --lib registry_loom
