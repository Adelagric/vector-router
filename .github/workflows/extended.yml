name: Extended

# Slow verifications (miri). Kept separate from the CI workflow so pushes
# and PRs are not blocked while these run. Triggered on:
#   - every push to main
#   - nightly cron at 03:17 UTC
#   - manual workflow_dispatch
#
# Note on loom: `make loom` runs the concurrency model check on
# `registry::registry_loom` locally. It is NOT wired into CI because
# `RUSTFLAGS=--cfg loom` propagates to every dependency in the build graph,
# and `hyper-util` cannot compile when `tokio` is built with `cfg(loom)`
# (no `tokio::net` under loom). Making this work in CI would require
# either splitting `registry` into a separate workspace crate that does
# not depend on tokio, or feature-gating `qdrant-client` as optional and
# rebuilding without it under loom. Both are invasive; the manual
# `make loom` target stays available for contributors who want to verify
# the concurrency model locally.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  # See ci.yml: pin a portable target-cpu so the build script never SIGILLs on
  # a CI runner whose CPU lacks an instruction selected by target-cpu=native.
  RUSTFLAGS: "-C target-cpu=x86-64-v2"

jobs:
  miri:
    name: miri (math + pool)
    runs-on: ubuntu-latest
    env:
      # Override rust-toolchain.toml which pins stable 1.95.0; miri only
      # ships on nightly.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4

      - name: Install protobuf compiler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - name: Nightly toolchain + miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: miri

      - name: cargo miri setup
        run: cargo miri setup

      - name: cargo miri test --lib math
        run: cargo miri test --lib math

      - name: cargo miri test --lib pool
        run: cargo miri test --lib pool
