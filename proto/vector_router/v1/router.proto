syntax = "proto3";

package vector_router.v1;

// Main service: ingestion and search of already-computed vectors.
// Both RPCs share the same validation and normalization logic; only the
// final Qdrant operation differs (upsert vs search).
service VectorRouter {
  rpc Upsert(UpsertRequest) returns (UpsertResponse);
  rpc Search(SearchRequest) returns (SearchResponse);
}

// --- Upsert ------------------------------------------------------------------

message UpsertRequest {
  // Identifier of the source model. Must be declared in the server-side registry.
  string model_id = 1;
  // Identifier of the point in the vector database.
  string point_id = 2;
  // f32 vector encoded little-endian. Expected length = dim * 4 bytes.
  bytes vector = 3;
  // Redundant dimension for an explicit client contract; validated against model_id.
  uint32 dim = 4;
  // Arbitrary metadata forwarded to the vector database.
  map<string, string> metadata = 5;
  // Logical identifier of the embedding producer (e.g. "search-service-v2",
  // "batch-nightly"). Optional; empty => "unknown" on the metrics/log side.
  // Must be a bounded set of values (service name, not UUID) to avoid
  // exploding Prometheus label cardinality.
  string producer_id = 6;
}

message UpsertResponse {
  string point_id = 1;
  // Middleware-side processing time, in microseconds.
  uint64 processing_us = 2;
  bool was_normalized = 3;
  // Namespace resolved by the registry for this model.
  string vdb_namespace = 4;
}

// --- Search ------------------------------------------------------------------

message SearchRequest {
  // Identifier of the source model — must match the model used to produce
  // the stored vectors being queried. Determines the namespace and the
  // normalization policy applied to `vector`.
  string model_id = 1;
  // f32 little-endian query vector. Expected length = dim * 4 bytes.
  bytes vector = 2;
  // Redundant dimension for an explicit client contract.
  uint32 dim = 3;
  // Maximum number of results to return (k nearest neighbors).
  uint32 limit = 4;
  // Optional threshold on the similarity score; points below are filtered
  // out. 0.0 = no filtering. Score semantics depend on the configured
  // Qdrant distance (cosine, dot, euclidean).
  float score_threshold = 5;
  // Optional filter on the metadata of stored points (key/value equality).
  map<string, string> metadata_filter = 6;
  // Logical producer identifier (e.g. "search-frontend", "api-gateway").
  // Bounded cardinality, cf. UpsertRequest.producer_id.
  string producer_id = 7;
}

message SearchResponse {
  repeated SearchHit hits = 1;
  uint64 processing_us = 2;
  bool was_normalized = 3;
  string vdb_namespace = 4;
}

message SearchHit {
  string point_id = 1;
  // Similarity score. Range depends on the Qdrant distance:
  // - cosine    : [-1, 1], larger = closer.
  // - dot       : unbounded, larger = closer.
  // - euclidean : [0, +∞), smaller = closer.
  float score = 2;
  map<string, string> metadata = 3;
}
